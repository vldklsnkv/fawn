[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fawn"
version = "0.1.0"
description = "Local, portable inbox for links and media, built around Obsidian."
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = []

[project.scripts]
fawn = "fawn.cli:main"

[tool.setuptools.packages.find]
include = ["fawn*"]
